# ==============================================================================
# AgentSwarm Render Blueprint Specification
# ==============================================================================
# Deploys:
#   1. Managed PostgreSQL Database (agentswarm-db)
#   2. FastAPI Backend Service (agentswarm-api)
#   3. React Static Site Frontend (agentswarm-web)
# ==============================================================================

databases:
  - name: agentswarm-db
    databaseName: agentswarm
    user: agentswarm_user
    plan: free

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: agentswarm-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: agentswarm-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: agentswarm-web
          envVarKey: RENDER_EXTERNAL_URL

  # ----------------------------------------------------------------------------
  # 2. React Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: agentswarm-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: agentswarm-api
          envVarKey: RENDER_EXTERNAL_URL
